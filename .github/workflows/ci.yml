name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    # Archon's own pull requests are verified on the droplet before they are published
    # (archon.verify posts this check's status); this job runs on main and on people's pull requests.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'archon/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
