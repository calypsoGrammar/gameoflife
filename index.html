<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="./src/stylesheets/style.css">
    <title>Game of Life</title>
  </head>
  <body class='min-h-screen max-h-screen'>

    <nav
    class="z-30 rounded-lg bg-white fixed top-[6px] h-12 left-1/2 transform -translate-x-1/2 flex flex-row justify-around items-center shadow-lg w-full max-w-xl">
      <button id="PLAY" class="flex justify-center items-center active:scale-95 hover:scale-105">
        <img src="./src/public/playCircled.svg">
      </button>
      <button id="PAUSE" class="flex justify-center items-center active:scale-95 hover:scale-105">
        <img src="./src/public/playPause.svg">
      </button>
      <button id="STEP" class="flex justify-center items-center active:scale-95 hover:scale-105">
        <img src="./src/public/playNext.svg">
      </button>
      <button id="RESET" class="flex justify-center items-center active:scale-95 hover:scale-105">
        <img src="./src/public/undo.svg">
      </button>
      <input type="number" class="text-center mx-2 w-16" id="FREQUENCY" min="0.01" max="10" step="0.01" value="0.25">
      <button id="GRID" class="flex justify-center items-center active:scale-95 hover:scale-105">
        <img src="./src/public/grid.svg">
      </button>
      <button id="COUNT" class="flex justify-center items-center cursor-auto w-16">

      </button>
    </nav>
    
    <canvas
    id="CANVAS"
    oncontextmenu="return false;"
    class="fixed top-0 left-0 min-h-screen max-h-screen"></canvas>

  </body>
  <script type='module' src="./src/javascripts/main.js"></script>
</html>
